// Wire contract shared by the koto daemon (Go), the TUI (Go), and the
// Android client (Kotlin). Generated Go code lands in ./pb (committed; run
// `make proto-gen`). Field names are snake_case to match the historical JSON
// keys the TUI still consumes via protojson(UseProtoNames:true).
//
// Conventions:
//   - proto3 scalar zero-values are not serialized, reproducing the old
//     `omitempty` behavior on the wire.
//   - protobuf has no struct embedding, so the old BaseResp{ok,error} is
//     flattened into every *Resp as fields 1 and 2.
//   - `ts` and schedule timestamps stay `double` (Python time.time() seconds);
//     History pages compare ts < before, so the float contract must hold.
//   - arbitrary JSON objects (config, metrics) map to google.protobuf.Struct.
syntax = "proto3";

package koto;

option go_package = "koto-protocol/pb;pb";

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

service Koto {
  // ---- unary (one per legacy dispatch case) ----
  rpc Spawn       (SpawnReq)       returns (SpawnResp);
  rpc Send        (SendReq)        returns (BaseResp);
  rpc List        (ListReq)        returns (ListResp);
  rpc Stop        (GroupReq)       returns (BaseResp);
  rpc Interrupt   (GroupReq)       returns (BaseResp);
  rpc Destroy     (GroupReq)       returns (BaseResp);
  rpc Restart     (GroupReq)       returns (SpawnResp);
  rpc History     (HistoryReq)     returns (HistoryResp);
  rpc Config      (ConfigReq)      returns (ConfigResp);
  rpc Metrics     (MetricsReq)     returns (MetricsResp);
  rpc Clear       (GroupReq)       returns (BaseResp);
  rpc Skills      (SkillListReq)   returns (SkillsResp);
  rpc SkillNew    (SkillNewReq)    returns (SkillNewResp);
  rpc SkillRead   (SkillReadReq)   returns (SkillReadResp);
  // Jobs lists a group's background jobs (cs-job) fresh from the guest —
  // group "" reads across all running groups (needs the "*" target, like
  // global metrics). JobLogs returns one job's metadata + an output tail.
  rpc Jobs        (JobsReq)        returns (JobsResp);
  rpc JobLogs     (JobLogsReq)     returns (JobLogsResp);
  // JobTail streams a job's combined output LIVE: an initial tail window,
  // then lines as the job writes them (guest-side `tail -c -f` over the
  // agent's exec_stream; client cancel kills the guest tail). Reuses the
  // ScriptEvent frame vocabulary (data/end/error); data chunks are whole
  // sanitized lines. Ordinary grantable verb (job_tail), group-scoped.
  rpc JobTail     (JobTailReq)     returns (stream ScriptEvent);
  rpc SchedAdd    (SchedAddReq)    returns (SchedAddResp);
  rpc SchedList   (SchedListReq)   returns (SchedListResp);
  rpc SchedDel    (SchedIDReq)     returns (BaseResp);
  rpc SchedToggle (SchedToggleReq) returns (BaseResp);
  rpc SchedRun    (SchedIDReq)     returns (BaseResp);

  // ---- ACL management (HARDCODED admin-only: these verbs can never be
  // granted via acl.json — a role granting itself acl_set_role would be
  // privilege escalation to full control; see daemon/acl.go) ----
  rpc AclGet     (AclGetReq)     returns (AclResp);
  rpc AclSetRole (AclSetRoleReq) returns (AclResp);
  rpc AclDelRole (AclDelRoleReq) returns (AclResp);

  // RunScript executes a POSIX sh script inside a group's microVM as the
  // guest worker user (node, uid 1000, cwd /workspace) and streams its
  // combined stdout+stderr live. Also HARDCODED admin-only (daemon/acl.go):
  // it is direct code execution in the VM, bypassing the agent loop, so it
  // is not delegatable via acl.json. Client cancel kills the script's
  // process group in the guest. Frames: `data` (chunk bytes) … `end`;
  // failures surface as one `error` frame (in-band, like {ok,error}).
  // No exit code is carried — append `; echo rc=$?` if you need it.
  rpc RunScript (RunScriptReq) returns (stream ScriptEvent);

  // AttachShell is the first bidi-streaming RPC in this file: the client
  // sends a stream of ShellInput (one `open`, then any number of `data` /
  // `resize` messages as the human types/resizes their terminal) and
  // receives a stream of ShellFrame (raw PTY output). It attaches to a
  // persistent tmux session in the group's guest VM (default "koto-shell") —
  // tmux itself, not this RPC, owns multi-attach mirroring and survival
  // across client disconnects (see daemon/fc.go fcShellDial, fcguest/main.go
  // handleShellAttach). An ordinary per-role grantable verb (attach_shell),
  // NOT hardcoded admin-only like run_script — see daemon/acl.go: unlike
  // run_script this is meant to be agent-cooperative, not an operator bypass.
  //
  // `group` is repeated on every ShellInput variant, not just `open`. This
  // isn't redundancy for its own sake: daemon/auth.go's aclStream.RecvMsg
  // re-authorizes EVERY client-sent message against its own decoded target,
  // so a `data`/`resize` message without `group` would silently downgrade to
  // verb-only authorization instead of verb+target for the rest of the
  // stream. The daemon captures `group` from the `open` message and treats
  // it as fixed for the life of the call — a later message naming a
  // different (even if independently-authorized) group is a protocol error.
  rpc AttachShell (stream ShellInput) returns (stream ShellFrame);

  // ---- server-streaming (the old connection-ownership-transfer cases) ----
  // Stream-open replaces the old {ok,subscribed} ack frame. A bad group or
  // failed auth surfaces as a non-OK gRPC status at open time.
  rpc SubscribeGroup (SubscribeReq) returns (stream Event);
  rpc SubscribeLogs  (LogsReq)      returns (stream LogEvent);
  // WatchState pushes a full group-state snapshot whenever it changes
  // (spawn/stop/stall/queue-depth/config), replacing client-side List
  // polling. The first frame arrives immediately; later frames only on
  // change. Snapshots are idempotent — a client may miss intermediate
  // frames and still converge on the latest one.
  rpc WatchState (WatchReq) returns (stream StateFrame);
}

// ---- streaming frames ----

message Event {
  string event      = 1;
  string group      = 2;
  double ts         = 3;
  string msg        = 4;
  string text       = 5;
  string name       = 6;
  string input      = 7;
  int32  words      = 8;
  string body       = 9;
  bool   historical = 10;
  string id         = 11;
  // Per-group monotonic sequence number, assigned by the daemon at emit
  // time (starts at 1; resets on daemon restart). Streaming frames carry
  // it so clients can resume a broken stream gaplessly via
  // SubscribeReq.since_seq. History RPC events re-parsed from the log file
  // have seq 0 — the cursor only exists for the live stream. The synthetic
  // `gap` event (see SubscribeReq) also carries seq 0.
  uint64 seq        = 12;
  // Session within the group this frame belongs to. "" is the group's
  // default session (which is also what every pre-session log line parses
  // as); a non-empty name is one of the multiplexed side-sessions created
  // by sending with SendReq.session. Stamped by the daemon's log parser
  // from the [[session]] turn markers, so live and History frames agree.
  string session    = 13;
}

message RunScriptReq {
  string group  = 1;
  string script = 2; // passed to /bin/sh -c, cwd /workspace, as node (uid 1000)
}

message ScriptEvent {
  string event = 1; // data | end | error | event
  bytes  chunk = 2; // data: raw combined stdout+stderr bytes, in stream order
  string error = 3; // error: what failed (spawn, VM dial, …)
  // event: one chat-grammar frame, present when JobTailReq.parsed asked the
  // daemon to run the job's output through the same [[marker]] parser the
  // group log tailer uses (a cs-subagent job writes that framing). chunk is
  // empty on these frames.
  Event  parsed = 4;
}

// ---- shared shell (AttachShell) --------------------------------------------
//
// Wire framing on the underlying guest vsock connection (daemon/fc.go
// fcShellDial, fcguest/main.go handleShellAttach) is the same
// [type byte][uint32 BE len][payload] shape run_script uses (fc.go
// fcReadScriptFrame / fcguest writeScriptFrame), extended with two new
// host->guest frame types ('I' input, 'R' resize) alongside the existing
// guest->host 'D'/'E'/'X'. This proto only carries the gRPC-facing shape;
// the vsock frame types are an internal daemon<->guest wire detail.

// One client->server message. `group` is repeated on every variant (see the
// AttachShell rpc comment above) so daemon/acl.go's targetOf() can authorize
// every message, not just the first. Exactly one `open` must be sent, first,
// before any `data`/`resize` — a `data`/`resize` before `open` is a protocol
// error and aborts the stream. `close` is a clean client-requested end,
// distinct from just cancelling the stream (the common path); it exists for
// parity with ShellFrame's event vocabulary, not because callers must use it.
message ShellInput {
  string group = 1;
  oneof input {
    ShellOpen   open   = 2;
    bytes       data   = 3; // raw bytes to write to the pty (keystrokes, pastes)
    ShellResize resize = 4;
    bool        close  = 5; // client-requested clean end
  }
}

// First message of a stream. `session` names the tmux session to
// create-or-attach (tmux -A semantics); empty defaults to "koto-shell", the
// convention documented in prompts/global.md so the group's own agent can
// find the same session via its Bash tool. cols/rows seed the pty's initial
// TIOCSWINSZ before tmux starts.
message ShellOpen {
  string session = 1;
  uint32 cols    = 2;
  uint32 rows    = 3;
}

message ShellResize { uint32 cols = 1; uint32 rows = 2; }

// One server->client message. Mirrors ScriptEvent's event vocabulary
// (data/end/error) on purpose, though `end` means something different here:
// for RunScript it means "the script exited"; for AttachShell it means "the
// guest-side pty/tmux-client plumbing for THIS connection tore down" (e.g.
// the VM restarted) — the tmux SESSION itself may still be alive and
// reattachable on the next AttachShell call, since detaching a client never
// kills a tmux session.
message ShellFrame {
  string event = 1; // data | end | error
  bytes  chunk = 2; // data: raw PTY output bytes, in stream order
  string error = 3; // error: what failed (pty alloc, tmux spawn, vsock dial)
}

message LogEvent {
  string event     = 1; // always "log"
  string level     = 2; // info | warn | error | debug
  string msg       = 3;
  double ts        = 4;
  string subsystem = 5; // emitting subsystem: acl | auth | fc | egress | sched | ...
  // Owning group when the line is about one group (fc/egress/send/shell/...);
  // "" for daemon-wide lines (bind, cron load, acl role edits). Clients use
  // it to scope the log view to whatever group the user is looking at.
  string group     = 6;
}

// ---- value shapes ----

message GroupInfo {
  int32  port     = 1;
  bool   running  = 2;
  string provider = 3;
  string model    = 4;
  string effort   = 5;
  bool   stalled  = 6;
  int32  queued   = 7;
  // Named sessions known to this group (sorted; the default session is
  // implicit and never listed). Fed from the daemon's host-side registry,
  // updated on send/clear, so clients can offer a session picker.
  repeated string sessions = 8;
  // Background jobs (cs-job) currently on the guest's disk, from the
  // daemon's periodically refreshed mirror (see daemon/jobs.go) — the tree's
  // per-session job rows are driven by this. Meta only; output rides the
  // JobLogs RPC.
  repeated JobInfo jobs = 9;
}

// One background job (sidecar/cs-job) in a group's guest, attributed to the
// chat session whose turn launched it (cs-job records $KOTO_SESSION at mint).
message JobInfo {
  string id       = 1;
  string session  = 2; // "" = the group's default session
  string status   = 3; // running | done | orphaned | unknown
  string rc       = 4; // exit code as string; "" while running
  string cmd      = 5; // command line, truncated to ~200 bytes
  int64  started  = 6; // unix seconds
  int64  out_size = 7; // combined-output bytes so far
  string group    = 8; // set in JobsResp (all-groups form); implied elsewhere
}

message SkillItem {
  string name        = 1;
  string description = 2;
  string path        = 3;
  bool   enabled     = 4;
}

message ScheduleItem {
  string id            = 1;
  string group         = 2;
  string cron          = 3;
  string msg           = 4;
  bool   enabled       = 5;
  double created_at    = 6;
  double last_fired_at = 7;
  double next_due_at   = 8;
}

// ---- requests ----

message SpawnReq  { string group = 1; bool main = 2; string provider = 3; string model = 4; string size = 5; }
message SendReq   {
  string group      = 1;
  string msg        = 2;
  // Optional attachments. The daemon's Send handler processes these BEFORE
  // enqueueSend, so the per-group queue still carries a plain text turn:
  //   - image: written to groups/<g>/.cs/uploads/img-<ts>.<ext>; msg body gets
  //     "\n[image: .cs/uploads/img-<ts>.<ext>]" appended so the claude CLI reads
  //     the file from its workspace.
  //   - audio: CURRENTLY UNSUPPORTED. Server-side transcription ran a whisper
  //     container over the DooD podman socket, which was removed (it was
  //     cs_host's last path to host authority). The fields are retained for
  //     wire compat; a request carrying audio is rejected in-band with a clear
  //     error. If voice notes return, transcribe via a pre-started
  //     --network=none whisper sidecar over a private socket, not DooD.
  bytes  image      = 3;
  string image_mime = 4; // image/jpeg | image/png | ...
  bytes  audio      = 5; // currently rejected server-side (see above)
  string audio_mime = 6;
  // Session to deliver the turn into. "" (and the aliases "-"/"default")
  // is the group's default session — the pre-session behavior. Any other
  // name (same charset as group names) addresses an independent claude
  // conversation multiplexed onto the same group/VM: first send creates
  // it, later sends continue it. Turns across sessions of one group are
  // still serialized by the per-group queue.
  string session    = 7;
}
// stop / interrupt / destroy / restart / clear. `session` is read by Clear
// only: "" = clear the whole group (every session + the full transcript,
// the legacy behavior); "-"/"default" = only the default session; a name =
// only that session. Per-session clear resets the conversation and removes
// the session's lines from the transcript, leaving other sessions intact.
message GroupReq  { string group = 1; string session = 2; }
message ListReq   {}
message LogsReq   {}
message WatchReq  {}

// since_seq = 0 requests live-only delivery (the historical behavior).
// since_seq > 0 asks the daemon to first replay, from its in-memory
// per-group ring, every event with seq > since_seq — registered atomically
// with the ring snapshot, so the client sees no gap and no duplicate across
// the replay/live boundary. When the ring cannot cover the range (events
// aged out, or the daemon restarted and seq regressed), the stream starts
// with a synthetic Event{event:"gap"}: the client's view is stale beyond
// repair by replay and it should refetch via History.
message SubscribeReq {
  string group     = 1;
  uint64 since_seq = 2;
}

// One WatchState frame: the same groups map List returns, pushed on change.
message StateFrame {
  map<string, GroupInfo> groups = 1;
  double ts                     = 2;
}

message HistoryReq {
  string group  = 1;
  int32  limit  = 2; // 0 => server default
  double before = 3; // 0 => tail page; else events with ts < before
}

// Tri-state per field (absent / clear / set), preserving the old
// json.RawMessage semantics:
//   - scalar fields use proto3 `optional` for presence: absent => not set;
//     clear => present with value ""; set => present with value.
//   - skills is a list, which has no field presence, so a oneof carries the
//     three states explicitly.
message SkillList { repeated string items = 1; }
message ConfigReq {
  string group = 1;
  optional string model    = 2;
  optional string effort   = 3;
  optional string ports    = 5;
  optional string provider = 7;
  optional string internet = 9;   // DEPRECATED — legacy none|full; daemon maps full→network=wan
  optional string size     = 10;  // small|medium|large|xlarge — applies on /restart
  optional string root     = 11;  // yes|no — passwordless sudo in guest; applies on /restart
  optional string network  = 12;  // none|wan|lan|full — egress profile; applies on /restart
  optional string autostart = 13; // yes|no — boot this group's VM when the daemon starts
  oneof skills_action {
    google.protobuf.Empty skills_clear = 8;
    SkillList             skills_set   = 4;
  }
}

message JobsReq { string group = 1; } // "" = all running groups
message JobsResp {
  bool ok = 1; string error = 2;
  repeated JobInfo jobs = 3; // JobInfo.group set on every entry
}

message JobLogsReq {
  string group = 1;
  string id    = 2;
  int64  tail  = 3; // output bytes from the end; 0 => 4096, capped at 65536
}
message JobTailReq {
  string group = 1;
  string id    = 2;
  int64  tail  = 3; // initial window bytes before following; 0 => 65536
  // Parse the output stream with the daemon's log-tailer grammar and send
  // `event` frames (ScriptEvent.parsed) instead of raw `data` chunks. Lets
  // clients render agent-framed job output (cs-job spawn) exactly like a
  // chat turn without reimplementing the marker grammar client-side.
  bool   parsed = 4;
}

message JobLogsResp {
  bool ok = 1; string error = 2;
  JobInfo job      = 3;
  string  output    = 4; // the tail itself (sanitized like chat events)
  bool    truncated = 5; // true when out_size exceeds the returned tail
}

message SkillListReq { string group = 1; }
message SkillNewReq  { string name = 1; }
message SkillReadReq { string name = 1; }
message MetricsReq   { string group = 1; }

message SchedAddReq    { string group = 1; string cron = 2; string msg = 3; }
message SchedListReq   { string group = 1; }
message SchedIDReq     { string id = 1; }
message SchedToggleReq { string id = 1; bool enabled = 2; }

// ---- responses (ok/error flattened from the old BaseResp) ----

message BaseResp { bool ok = 1; string error = 2; }

message SpawnResp { bool ok = 1; string error = 2; int32 port = 3; }

message ListResp {
  bool ok = 1; string error = 2;
  map<string, GroupInfo> groups = 3;
}

message HistoryResp {
  bool ok = 1; string error = 2;
  repeated Event events = 3;
  bool more = 4;
}

message ConfigResp {
  bool ok = 1; string error = 2;
  google.protobuf.Struct config = 3;
}

message MetricsResp {
  bool ok = 1; string error = 2;
  google.protobuf.Struct metric = 3;
  google.protobuf.Struct global_metric = 4;
}

message SkillsResp {
  bool ok = 1; string error = 2;
  repeated SkillItem skills = 3;
}

message SkillNewResp { bool ok = 1; string error = 2; string path = 3; }
message SkillReadResp { bool ok = 1; string error = 2; string name = 3; string content = 4; }

message SchedAddResp { bool ok = 1; string error = 2; ScheduleItem item = 3; }
message SchedListResp {
  bool ok = 1; string error = 2;
  repeated ScheduleItem schedules = 3;
}

// ---- ACL management ---------------------------------------------------------
// The ACL document (role -> {verb -> "*" | [groups]}) maps to a Struct the
// same way config/metrics do. The admin role is hardcoded in the daemon and
// never appears in (or is accepted into) this document.
message AclGetReq {}
message AclSetRoleReq {
  string role = 1;
  google.protobuf.Struct grants = 2;  // {verb: "*" | [group, ...]}
}
message AclDelRoleReq { string role = 1; }
message AclResp {
  bool ok = 1; string error = 2;
  google.protobuf.Struct acl = 3;  // full document after the operation
}
