# Dependabot VERSION updates (coordinator / operator 2026-11-20). Security
# updates are enabled repo-side and are not configured here; they ignore the
# cooldown, so a fix still arrives at once.
#
# cooldown default-days 42 = the 6-week dependency-age rule (CLAUDE.md,
# Conventions): a non-security bump is only proposed once the release is
# >= 6 weeks old. PRs target develop, weekly, minor+patch grouped per
# ecosystem, few open at a time. Every PR still goes through supplychain.yml
# (dep-age, govulncheck, osv) and sbom.yml.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/daemon", "/fcguest", "/tui", "/protocol"]
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 42
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 42
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/fcguest"
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 42
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
