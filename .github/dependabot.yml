# Dependabot VERSION updates (coordinator / operator 2026-11-20). Security
# updates are enabled repo-side and are not configured here.
#
# No cooldown: the 42-day dependency-age gate was removed by operator
# decision 2026-11-28. PRs target develop, weekly, minor+patch grouped per
# ecosystem, few open at a time. Every PR still goes through supplychain.yml
# (govulncheck, osv-scanner, mod verify) and sbom.yml; every bump stays
# pinned (go.sum, action SHA, image digest).
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/daemon", "/fcguest", "/tui", "/protocol"]
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/fcguest"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
