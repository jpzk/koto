# supplychain — Go supply-chain checks on every push / PR to the long-lived
# branches. The CycloneDX SBOM (build, osv SARIF to Code scanning, dependency
# snapshot for Dependabot) moved to sbom.yml + sbom-daily.yml.
#
# This file REPLACES govulncheck.yml (which ran only on release pushes): the
# govulncheck logic and its rationale live here, once. What runs, per module
# (daemon fcguest tui protocol), each with GOWORK=off:
#
#   env          the Go supply-chain env is the default one: GOFLAGS has no
#                -insecure / -mod=mod, GONOSUMDB / GONOSUMCHECK / GOINSECURE /
#                GOPRIVATE / GONOPROXY are unset, GOPROXY is the public proxy
#                and GOSUMDB is sum.golang.org. A runner image or a future
#                edit that weakens checksum verification fails here first.
#   verify       go mod verify: the module cache matches go.sum.
#   tidy         go mod tidy -diff: go.mod / go.sum have not drifted from the
#                imports (a dependency added by hand, or one left behind).
#   govulncheck  reachable vulnerabilities (call graph) = failure.
#   dep-age      every module version NEW or CHANGED vs the base must be >= 6
#                weeks old on proxy.golang.org (CLAUDE.md "Conventions").
#                Exceptions only via .github/supplychain/dep-age-allow.txt,
#                with a reason. scripts/supplychain/dep-age.sh.
#   osv-scanner  full inventory (not just reachable code) against OSV, for the
#                four go.mod files AND Firecracker's Cargo.lock at the
#                FC_COMMIT that build-firecracker.sh builds — the Rust
#                component ships in the release and has no other scanner.
#                Findings fail; exceptions only via osv-scanner.toml
#                [[IgnoredVulns]] with a reason and an ignoreUntil expiry.
#                govulncheck = reachability, osv-scanner = inventory.
#
# Go version: pinned to the exact version the release binaries are BUILT with
# (the Makefile's GO_IMAGE digest — `podman run --rm $GO_IMAGE go version`), so
# standard-library findings describe the shipped binaries, not whatever Go the
# runner happens to have. Bump the two together.
#
# Every third-party piece is pinned by SHA / version and is >= 6 weeks old at
# the time of pinning (2026-11-17, cutoff 2026-10-06), like every other
# dependency here. `go install pkg@vX.Y.Z` is verified by sum.golang.org.
#   actions/checkout                 v7.0.0   2026-06-18
#   actions/setup-go                 v6.5.0   2026-06-24
#   golang.org/x/vuln (govulncheck)  v1.6.0   2026-07-09
#   google/osv-scanner/v2            v2.5.1   2026-08-17 (v2.6.0 needs go 1.27)
name: supplychain

on:
  push:
    # `release` is the original long-lived branch; `release/<version>` is what
    # the release skill cuts per release (.claude/skills/release).
    branches: [main, develop, release, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, release, "release/**", "hotfix/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # One module at a time, each with its own go.mod — and GOWORK=off is what
  # makes that true (audit 2026-09-11 L26). go.work ties all four modules
  # together, and a go command run from a module BENEATH it uses workspace
  # mode, where minimal version selection runs across the union. The
  # manifests genuinely diverge: daemon requires x/text v0.41.0 while
  # fcguest, protocol and tui require v0.40.0, so in workspace mode all four
  # were analysed at v0.41.0 while three of them SHIP v0.40.0. Measured:
  # `go list -m golang.org/x/text` in fcguest gives v0.41.0 under the
  # workspace and v0.40.0 with GOWORK=off. A vulnerability fixed in v0.41.0
  # but reachable in v0.40.0 would have passed this gate and shipped.
  GOWORK: "off"
  # CGO_ENABLED=0 for the same reason: the release binaries are built with
  # it (Makefile), and it changes which files build — the cgo-guarded
  # variants of net and os/user among them — so a scan with cgo enabled is
  # analysing a call graph that is not the one being released (audit
  # 2026-09-11 L123).
  CGO_ENABLED: "0"
  # Never let a go command rewrite go.mod / go.sum behind the checks' back.
  GOFLAGS: "-mod=readonly"
  MODULES: "daemon fcguest tui protocol"

jobs:
  go-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 2026-06-18
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0 2026-06-24
        with:
          go-version: "1.26.11" # = Makefile GO_IMAGE (golang:1.26.11-alpine digest)
          cache-dependency-path: |
            daemon/go.sum
            fcguest/go.sum
            tui/go.sum
            protocol/go.sum
      - name: assert default Go supply-chain env
        run: scripts/supplychain/go-env-check.sh
      # Wrapper only forgives Go's spurious "missing ziphash" for the dot-less
      # local-directory replace koto-protocol; see the script header.
      - name: go mod verify every module
        run: scripts/supplychain/mod-verify.sh $MODULES
      # MAIN LAG (hotfix/ci-supplychain, 2026-11-17): main's tui/go.sum lacks
      # the two github.com/MakeNowJust/heredoc v1.0.0 hash lines develop added
      # in 910bfda (go.sum only, no version change). The hotfix that brought
      # this workflow to main carries CI files only, so on main and hotfix/**
      # EXACTLY that diff in tui is a ::warning::, any other diff still fails.
      # Remove this exception once release/1.12.0 lands 910bfda on main.
      - name: go mod tidy -diff every module
        env:
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          rc=0
          lag=0
          case "$TARGET_REF" in main|hotfix/*) lag=1 ;; esac
          for m in $MODULES; do
            echo "::group::go mod tidy -diff $m"
            if d=$(cd "$m" && go mod tidy -diff 2>&1); then
              :
            else
              echo "$d"
              chg=$(printf '%s\n' "$d" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
              known=$(printf '%s\n' "$chg" | grep -cE '^\+github\.com/MakeNowJust/heredoc v1\.0\.0(/go\.mod)? h1:' || true)
              total=$(printf '%s\n' "$chg" | grep -c . || true)
              if [ "$lag" = 1 ] && [ "$m" = tui ] && [ "$known" = 2 ] && [ "$total" = 2 ]; then
                echo "::warning::tui/go.sum: known main lag (heredoc v1.0.0 hashes, fixed on develop by 910bfda; lands with release/1.12.0)"
              else
                echo "::error::$m: go.mod/go.sum not tidy"; rc=1
              fi
            fi
            echo "::endgroup::"
          done
          exit $rc
      # !cancelled(): govulncheck coverage must not depend on the tidy/verify steps.
      - if: ${{ !cancelled() }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      # The loop fails the job on a module with a reachable finding
      # (govulncheck exits 3) but still runs the rest so the log shows every
      # module's state.
      - name: govulncheck every module
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for m in $MODULES; do
            echo "::group::govulncheck $m"
            (cd "$m" && go list -m golang.org/x/text 2>/dev/null || true)
            (cd "$m" && govulncheck ./...) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  dep-age:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 2026-06-18
        with:
          fetch-depth: 0 # the gate diffs go.mod against the base commit
          persist-credentials: false
      # Base: the PR's target branch; for a push, the commit the branch was at
      # before it; for a new branch (before = 0000…) or a manual run there is
      # no meaningful base, so every version in every go.mod is checked.
      - name: dependency-age gate (>= 6 weeks)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push)
              if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] \
                 && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                base="$BEFORE"
              else
                base=--all
              fi ;;
            *) base=--all ;;
          esac
          echo "base: $base"
          scripts/supplychain/dep-age.sh "$base"

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 2026-06-18
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.5.0 2026-06-24
        with:
          go-version: "1.26.11" # = Makefile GO_IMAGE
          cache: false
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
      - name: osv-scanner (go.mod x4 + Firecracker Cargo.lock)
        run: scripts/supplychain/osv.sh "$RUNNER_TEMP/osv"
