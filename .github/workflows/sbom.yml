# sbom — one CycloneDX 1.6 SBOM for everything koto ships, on every push to
# main / develop / release/** and every PR to main / develop:
#
#   sbom               build koto_<ver>_x86_64.cdx.json (scripts/supplychain/
#                      sbom.sh: Go binaries + Firecracker crates + vmlinux +
#                      guest.img contents), upload it as the `sbom` artifact,
#                      osv-scan it to SARIF (osv-scanner.toml ignores apply).
#                      Findings FAIL this job — after the SARIF and the
#                      artifact are uploaded, so they are never silent and
#                      never lost.
#   code-scanning      upload the SARIF to the Code scanning tab
#                      (category sbom-osv). Runs even when `sbom` failed on
#                      findings: that is exactly when it matters.
#   dependency-graph   submit the SBOM's Go / cargo / npm components to the
#                      dependency submission API, so Dependabot alerts cover
#                      Firecracker's crates and guest.img's npm packages (no
#                      manifest in this repo) — scripts/supplychain/
#                      dep-snapshot.sh, curl + jq, HTTP 201 or fail.
#
# The daily re-scan of main is sbom-daily.yml. The SBOM PUBLISHED with a
# release is not this artifact: `make dist` builds it next to the assets and
# `make release-draft` uploads it while the release is a DRAFT (immutable once
# published).
#
# Privileges are split per job: only the job that runs repo code to build the
# SBOM has no write scope at all; the two upload jobs run pinned actions and
# one small script with exactly the one write scope each needs. Fork PRs get
# read-only tokens, so the two upload jobs are skipped for them.
#
# Pins (>= 6 weeks old at pinning, 2026-11-20, cutoff 2026-10-09):
#   actions/checkout                 v7.0.0   2026-06-18
#   actions/setup-go                 v6.5.0   2026-06-24
#   actions/upload-artifact          v7.0.1   2026-04-10
#   actions/download-artifact        v8.0.2   2026-10-07
#   github/codeql-action/upload-sarif v4.38.3 2026-10-08
#   CycloneDX/cyclonedx-gomod        v1.12.0  2026-08-21
#   google/osv-scanner/v2            v2.5.1   2026-08-17 (v2.6.0 needs go 1.27)
# Go 1.26.10 = Makefile GO_IMAGE, as in supplychain.yml.
name: sbom

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      ref: ${{ steps.meta.outputs.ref }}
      file: ${{ steps.meta.outputs.file }}
      sarif: ${{ steps.scan.outputs.sarif }}
    steps:
      # PRs: build from the PR HEAD, not the synthetic merge commit, so the
      # SBOM and the dependency snapshot describe a commit that exists.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 2026-06-18
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0 2026-06-24
        with:
          go-version: "1.26.10" # = Makefile GO_IMAGE
          cache-dependency-path: |
            daemon/go.sum
            tui/go.sum
            fcguest/go.sum
            protocol/go.sum
      - run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
      - id: meta
        name: version, commit, ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          base=$(sed -n 's/^DIST_VERSION *?= *//p' Makefile)
          ver="${base}-g${sha:0:7}"
          if [ "$EVENT" = pull_request ]; then ref="refs/heads/$HEAD_REF"; else ref="$GITHUB_REF"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "file=koto_${ver}_x86_64.cdx.json" >> "$GITHUB_OUTPUT"
          echo "koto $ver @ $sha ($ref)"
      - name: CycloneDX SBOM (koto, koto-tui, firecracker, vmlinux, guest.img)
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: scripts/supplychain/sbom.sh "$GITHUB_WORKSPACE/sbom-out" "$VER" x86_64
      - name: SBOM shape
        env:
          FILE: sbom-out/${{ steps.meta.outputs.file }}
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6"' "$FILE" >/dev/null
          for t in golang cargo rpm npm github oci; do
            n=$(jq --arg t "$t" '[.components[] | select(.purl // "" | startswith("pkg:" + $t + "/"))] | length' "$FILE")
            echo "pkg:$t components: $n"
            [ "$n" -gt 0 ] || { echo "::error::no pkg:$t components in the SBOM"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 2026-04-10
        with:
          name: sbom
          path: |
            sbom-out/*.cdx.json
            sbom-out/parts/*.cdx.json
          if-no-files-found: error
      - id: scan
        name: osv-scanner on the SBOM (SARIF)
        run: |
          rc=0
          scripts/supplychain/osv.sh --sbom sbom-out --sarif "$RUNNER_TEMP/sbom-osv.sarif" || rc=$?
          test -s "$RUNNER_TEMP/sbom-osv.sarif" && echo "sarif=true" >> "$GITHUB_OUTPUT"
          echo "$rc" > "$RUNNER_TEMP/osv.rc"
      - if: ${{ steps.scan.outputs.sarif == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 2026-04-10
        with:
          name: sbom-osv-sarif
          path: ${{ runner.temp }}/sbom-osv.sarif
          if-no-files-found: error
      - name: fail on osv findings
        run: |
          rc=$(cat "$RUNNER_TEMP/osv.rc")
          case "$rc" in
            0) echo "osv: no findings" ;;
            1) echo "::error::osv-scanner found vulnerabilities in the SBOM (see Code scanning, category sbom-osv); fix or add a dated ignore to osv-scanner.toml"; exit 1 ;;
            *) echo "::error::osv-scanner failed (exit $rc)"; exit 1 ;;
          esac

  code-scanning:
    needs: sbom
    if: ${{ !cancelled() && needs.sbom.outputs.sarif == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 2026-10-07
        with:
          name: sbom-osv-sarif
          path: sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3 2026-10-08
        with:
          sarif_file: sarif/sbom-osv.sarif
          category: sbom-osv
          ref: ${{ needs.sbom.outputs.ref }}
          sha: ${{ needs.sbom.outputs.sha }}

  dependency-graph:
    needs: sbom
    if: ${{ !cancelled() && needs.sbom.outputs.file != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dependency-graph/snapshots
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 2026-06-18
        with:
          ref: ${{ needs.sbom.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/supplychain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 2026-10-07
        with:
          name: sbom
          path: sbom-out
      - name: submit dependency snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ needs.sbom.outputs.sha }}
          SNAPSHOT_REF: ${{ needs.sbom.outputs.ref }}
          FILE: sbom-out/${{ needs.sbom.outputs.file }}
        run: scripts/supplychain/dep-snapshot.sh "$FILE"
